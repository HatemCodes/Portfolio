<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hatem Chehade — Computer Science Student & Builder</title>
    <meta
      name="description"
      content="Fourth-year CS student at the University of Calgary. Security, privacy, and products built for the people the internet usually ignores."
    />
    <meta name="author" content="Hatem Chehade" />

    <!-- Link previews (LinkedIn, Slack, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hatem Chehade — Computer Science Student & Builder" />
    <meta
      property="og:description"
      content="I build software people can actually trust. Security, privacy, and products for the people the internet usually ignores."
    />
    <meta property="og:image" content="/hatem.jpg" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Applies the saved theme before first paint, so there is no flash. -->
    <script>
      (function () {
        var t = "light";
        try {
          t = localStorage.getItem("theme") || "light";
        } catch (e) {}
        document.documentElement.dataset.theme = t === "dark" ? "dark" : "light";
        var m = document.createElement("meta");
        m.name = "theme-color";
        m.content = t === "dark" ? "#131218" : "#fffdf8";
        document.head.appendChild(m);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
