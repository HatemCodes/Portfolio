<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hatem Chehade — Computer Science, University of Calgary</title>
    <meta
      name="description"
      content="Fourth-year CS student at the University of Calgary building systems where trust is the hard part: encryption, verification, and privacy-first design."
    />
    <meta name="author" content="Hatem Chehade" />

    <!-- Open Graph / link previews (LinkedIn, Slack, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hatem Chehade — Computer Science, University of Calgary" />
    <meta
      property="og:description"
      content="Encryption, verification, and privacy-first design. Fourth-year CS at the University of Calgary."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Applies the saved theme before first paint so there is no flash of the
         wrong colour scheme. To follow the visitor's OS setting instead of
         defaulting to dark, replace "dark" on the last line with:
         (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") -->
    <script>
      (function () {
        var t = "dark";
        try {
          t = localStorage.getItem("theme") || "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
        var m = document.createElement("meta");
        m.name = "theme-color";
        m.content = t === "light" ? "#fbfbfa" : "#0a0b0d";
        document.head.appendChild(m);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
